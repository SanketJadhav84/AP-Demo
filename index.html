<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Release checklist</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header>
      <h1>Release checklist</h1>
      <p id="summary">No tasks yet, add one  </p>
    </header>

    <form id="add-form">
      <label for="task-input" class="visually-hidden">New task</label>
      <input id="task-input" type="text" placeholder="Add a task, for example: run smoke tests" autocomplete="off" required>
      <button type="submit" class="primary">Add task</button>
    </form>

    <div class="filters" role="group" aria-label="Filter tasks">
      <button type="button" data-filter="all" aria-pressed="true">All</button>
      <button type="button" data-filter="open" aria-pressed="false">Open</button>
      <button type="button" data-filter="done" aria-pressed="false">Done</button>
    </div>

    <ul id="task-list"></ul>
    <p id="empty" hidden>Nothing here. Add your first task above.</p>
  </main>
  <script src="app.js"></script>
</body>
</html>
